      { id: 'ci-01', categoryId: 'cari-ide', title: 'Brainstorming Premis Konflik Batin', description: 'Gali 5 ide cerita berdasarkan tema memori, kehilangan, atau penerimaan hidup.', tag: 'Eksplorasi Premis', promptText: `Bertindaklah sebagai kurator dan editor buku antologi sastra berpengalaman.\nSaya sedang merencanakan sebuah naskah antologi dengan tema besar: "[MASUKKAN TEMA: misal: Luka Masa Lalu / Rumah / Melepaskan]".\n\nTolong bantu saya menyusun 5 variasi premis cerita fiksi/kisah personal yang unik dan menyentuh hati. Untuk setiap premis, sertakan:\n1. Premis Satu Kalimat (Tokoh utama, situasi awal, konflik batin yang dihadapi).\n2. Titik Balik Emosional (Momen kritis yang mengubah tokoh).\n3. Pesan / Katarsis Batin yang ingin ditinggalkan kepada pembaca.\n\nGunakan nada bahasa yang kontemplatif, hangat, dan manusiawi.` },

      // 2. Buat Outline
      { id: 'bo-01', categoryId: 'buat-outline', title: 'Struktur Alur 3 Babak Klasik (1000 Kata)', description: 'Susun outline seimbang antara pengenalan, eskalasi, dan resolusi cerita.', tag: '3 Babak', promptText: `Bertindaklah sebagai ahli struktur naratif.\nSaya ingin menulis naskah antologi dengan target panjang 1000 kata.\nPremis cerita saya: "[MASUKKAN PREMIS CERITA]".\n\nTolong buatkan outline naskah terperinci dengan pembagian:\n1. Babak 1: Titik Mula & Pembuka (±150 kata) — Penetapan latar dan suasana hati.\n2. Babak 2A: Eskalasi Konflik (±300 kata) — Pergulatan rasa dan interaksi kunci.\n3. Babak 2B: Titik Balik / Klimaks Emosi (±350 kata) — Puncak ketegangan batin.\n4. Babak 3: Resolusi & Katarsis (±200 kata) — Makna baru dan penutup kontemplatif.\n\nBerikan poin-poin adegan konkret di setiap babak.` },
      { id: 'bo-02', categoryId: 'buat-outline', title: 'Struktur Flash Narrative / Vignette (500 Kata)', description: 'Outline padat dan fokus untuk cerita pendek beraliran puitis.', tag: '500 Kata', promptText: `Saya membutuhkan outline untuk naskah singkat (Flash Essay / Vignette) sepanjang 500 kata.\nTopik cerita: "[MASUKKAN TOPIK/PERISTIWA]".\n\nSusun outline ringkas dan tajam dengan 3 bagian:\n- Scene 1: Visual Hook & Atmosfer Batin (100 kata)\n- Scene 2: Retakan Rasa & Perenungan Konflik (300 kata)\n- Scene 3: Pelepasan & Kalimat Gaung Akhir (100 kata)\n\nPastikan setiap bagian memiliki instruksi emosi spesifik bagi penulis.` },
      { id: 'bo-03', categoryId: 'buat-outline', title: 'Outline Struktur Non-Linear / Kilas Balik', description: 'Struktur alur bolak-balik antara masa kini dan masa lalu secara mulus.', tag: 'Alur Maju-Mundur', promptText: `Saya ingin menulis cerita dengan alur bolak-balik (non-linear) antara masa kini dan masa lalu.\nPeristiwa masa kini: "[PERISTIWA HARI INI]"\nPeristiwa masa lalu: "[MEMORI 10 TAHUN LALU]"\n\nBantu saya menyusun outline 5 sekuens adegan yang bergantian dengan jembatan transisi sensorik (seperti suara, aroma, atau benda pemicu memori) agar pembaca tidak bingung.` },
      { id: 'bo-04', categoryId: 'buat-outline', title: 'Pemetaan Pacing & Eskalasi Ketegangan Batin', description: 'Atur grafik emosi agar cerita tidak terasa datar di tengah naskah.', tag: 'Pacing & Tempo', promptText: `Berikut adalah ringkasan draf/ide cerita saya:\n"[JELASKAN RINGKASAN CERITA]".\n\nTolong evaluasi ritme (pacing) cerita ini dan buatkan kurva eskalasi emosi per paragraf. Beri tahu saya:\n1. Di mana tempo narasi harus diperlambat untuk menonjolkan detail rasa.\n2. Di mana tempo harus dipercepat untuk membangun ketegangan.\n3. Di mana letak puncak keheningan batin sebelum klimaks.` },
      { id: 'bo-05', categoryId: 'buat-outline', title: 'Outline Naskah Dialog Mendalam (Dua Tokoh)', description: 'Fokus pada percakapan penting yang membongkar rahasia di antara dua orang.', tag: 'Fokus Dialog', promptText: `Saya ingin menulis naskah antologi yang intinya bertumpu pada percakapan jujur antara dua orang tokoh: [TOKOH A] dan [TOKOH B] di tempat [LATAR LOKASI].\n\nBuatkan outline adegan demi adegan yang memandu bagaimana percakapan mereka bermula dari obrolan basa-basi dingin, meningkat menjadi saling menuntut kejujuran, hingga berakhir pada penerimaan.` },

      // 3. Perbaiki Judul
      { id: 'pj-01', categoryId: 'perbaiki-judul', title: '10 Alternatif Judul Puitis & Menggugah', description: 'Dapatkan 10 variasi judul bernuansa sastra dengan berbagai gaya bahasa.', tag: 'Koleksi Judul', promptText: `Bertindaklah sebagai editor judul buku antologi sastra.\nNaskah saya menceritakan tentang: "[JELASKAN INTI CERITA ATAU TOPIKNYA]".\nEmosi utama naskah: "[misal: Rindu yang tertahan / Kekecewaan yang menjadi ikhlas]".\n\nBerikan 10 opsi judul naskah dengan variasi gaya:\n- 3 Judul Singkat (1–2 kata, berbobot).\n- 4 Judul Puitis Kontemplatif (3–5 kata, metaforis).\n- 3 Judul Kalimat Menggantung (menimbulkan rasa penasaran).\n\nSertakan alasan singkat mengapa judul tersebut berdaya pikat.` },
      { id: 'pj-02', categoryId: 'perbaiki-judul', title: 'Judul Berbasis Paradoks & Kontras Rasa', description: 'Ciptakan judul yang menggabungkan dua hal berlawanan yang memikat rasa.', tag: 'Paradoks', promptText: `Bantu saya membuat 5 judul naskah antologi yang menggunakan teknik kontras / paradoks (seperti: "Menghangatkan Dingin", "Bising dalam Sunyi", "Belajar Pulang dari Perpisahan").\nInti cerita saya adalah: "[MASUKKAN INTI CERITA]".\n\nPastikan judul terdengar anggun, tidak klise, dan relevan dengan kisah saya.` },
      { id: 'pj-03', categoryId: 'perbaiki-judul', title: 'Judul Menggunakan Diksi Sastra Indonesia Indah', description: 'Manfaatkan diksi arkais seperti Renjana, Saujana, Swastamita, atau Arunika.', tag: 'Diksi Indah', promptText: `Saya ingin judul naskah saya memuat salah satu diksi sastra Indonesia yang indah dan mendalam (contoh: Renjana, Saujana, Nirmala, Swastamita, Senandika, Jenggala, atau lainnya).\nTema naskah: "[JELASKAN TEMA]".\n\nTolong pilihkan 5 diksi yang paling pas dan susun menjadi frasa judul yang berkelas dan tidak dipaksakan.` },
      { id: 'pj-04', categoryId: 'perbaiki-judul', title: 'Bedah dan Poles Judul yang Sudah Ada', description: 'Tingkatkan kualitas judul yang sedang kamu gunakan saat ini.', tag: 'Polish Judul', promptText: `Judul naskah kerja saya saat ini adalah: "[MASUKKAN JUDUL ANDA SAAT INI]".\nInti cerita: "[JELASKAN INTI CERITA]".\n\nTolong berikan penilaian jujur terhadap judul ini (apakah terlalu biasa, klise, atau kurang kuat?), lalu tawarkan 5 versi perbaikan yang lebih memikat bagi pembaca buku antologi.` },
      { id: 'pj-05', categoryId: 'perbaiki-judul', title: 'Judul Berdasarkan Kutipan Kunci Naskah', description: 'Ambil intisari kalimat terkuat di dalam naskah untuk dijadikan judul.', tag: 'Kutipan Judul', promptText: `Berikut adalah kutipan paragraf/kalimat terbaik dari naskah saya:\n"[MASUKKAN KUTIPAN TERBAIK DARI NASKAHMU]".\n\nBantu saya mengekstrak 5 ide judul potensial yang bersumber langsung dari jiwa kutipan di atas.` },

      // 4. Kalimat Pembuka
      { id: 'kp-01', categoryId: 'kalimat-pembuka', title: 'Hook Pembuka Aksi & Gerak Tokoh', description: 'Mulai cerita langsung di tengah adegan tanpa bertele-tele.', tag: 'In Media Res', promptText: `Saya ingin membuat paragraf pembuka naskah dengan teknik In Media Res (langsung masuk ke tengah aksi adegan).\nAdegan pembukanya adalah: "[JELASKAN ADEGAN AWAL: misal: Tokoh sedang mengepak koper terburu-buru di tengah malam]".\n\nTolong buatkan 3 alternatif paragraf pembuka (masing-masing 2–4 kalimat) yang langsung mencengkeram perhatian pembaca sejak kata pertama.` },
      { id: 'kp-02', categoryId: 'kalimat-pembuka', title: 'Hook Pembuka Berbasis Pengamatan Sensorik', description: 'Bangun suasana atmosferik lewat panca indra (bau, suara, suhu).', tag: 'Sensorik & Detail', promptText: `Bantu saya menulis kalimat pembuka naskah yang mengandalkan kepekaan panca indra (suara rintik di seng, aroma kopi dingin, atau gemetar ujung jemari).\nLatar tempat: "[TEMPAT CERITA]"\nSuasana hati: "[PERASAAN TOKOH]"\n\nBerikan 4 opsi kalimat pembuka yang puitis, hening, dan visual.` },
      { id: 'kp-03', categoryId: 'kalimat-pembuka', title: 'Hook Pernyataan Paradoksal / Filosofis', description: 'Mulai dengan satu kebenaran hidup yang mengejutkan atau kontemplatif.', tag: 'Kontemplatif', promptText: `Saya ingin membuka naskah saya dengan satu pernyataan batin yang kuat dan berani tentang: "[TOPIK: misal: Memaafkan orang yang tidak pernah meminta maaf]".\n\nTuliskan 5 opsi kalimat pembuka pertama yang terdengar seperti kutipan sastra klasik yang tak terlupakan.` },
      { id: 'kp-04', categoryId: 'kalimat-pembuka', title: 'Re-write Paragraf Pembuka yang Terasa Kaku', description: 'Poles paragraf pembuka yang ada agar lebih mengalir dan hidup.', tag: 'Rewrite Pembuka', promptText: `Berikut adalah paragraf pembuka naskah yang sudah saya tulis:\n"[PASTE PARAGRAF PEMBUKA ANDA DI SINI]".\n\nTolong perbaiki paragraf ini menjadi 3 versi:\n1. Versi Lebih Puitis & Sastrawi.\n2. Versi Lebih Minimalis & Tajam.\n3. Versi Lebih Emosional & Menghanyutkan.` },
      { id: 'kp-05', categoryId: 'kalimat-pembuka', title: 'Hook Pembuka Berbasis Dialog Menghentak', description: 'Gunakan satu baris dialog tajam sebagai kalimat pembuka naskah.', tag: 'Dialog Pembuka', promptText: `Saya ingin membuka cerita langsung dengan satu baris dialog yang membuat pembaca bertanya-tanya apa yang sedang terjadi.\nTopik konflik: "[KONFLIK TOKOH]".\n\nBerikan 5 opsi kalimat dialog pembuka beserta aksi fisik penyerta tokohnya.` },

      // 5. Kalimat Penutup
      { id: 'kt-01', categoryId: 'kalimat-penutup', title: 'Ending Reflektif yang Mengendap Tenang', description: 'Tutup cerita dengan kelegaan dan penerimaan yang tidak menggurui.', tag: 'Penerimaan', promptText: `Naskah saya menceritakan tentang: "[RINGKASAN AKHIR CERITA]".\nPesan batin yang ingin dicapai tokoh: "[misal: Berdamai dengan takdir dan belajar melangkah lagi]".\n\nTolong buatkan 4 opsi paragraf penutup (2–4 kalimat) yang memberikan rasa hangat, melegakan, dan tidak terkesan memberi nasihat klise.` },
      { id: 'kt-02', categoryId: 'kalimat-penutup', title: 'Circular Ending (Menautkan Kembali ke Awal)', description: 'Ikat akhir cerita dengan elemen yang muncul pada kalimat pertama.', tag: 'Circular Ending', promptText: `Paragraf pembuka naskah saya adalah:\n"[PASTE PARAGRAF PEMBUKA]"\n\nInti perjalanan cerita: "[JELASKAN PERUBAHAN TOKOH]"\n\nTolong bantu saya merangkai 3 opsi paragraf penutup yang merujuk kembali pada simbol/suasana di paragraf pembuka tadi, namun dengan makna batin yang sudah bertransformasi.` },
      { id: 'kt-03', categoryId: 'kalimat-penutup', title: 'Ending dengan Metafora Lanskap / Waktu', description: 'Gunakan perubahan alam (senja, fajar, musim) sebagai penutup adegan.', tag: 'Metafora Alam', promptText: `Saya ingin menutup naskah saya dengan metafora peralihan waktu (misal: fajar yang mulai menyingsing, kabut yang terangkat, atau jalanan kota yang kembali sunyi).\nMakna akhir cerita: "[MAKNA AKHIR]".\n\nBuatkan 3 kalimat penutup yang melankolis namun memberi harapan baru.` },
      { id: 'kt-04', categoryId: 'kalimat-penutup', title: 'Memoles Kalimat Terakhir yang Menggantung', description: 'Sempurnakan kalimat pamungkas agar memiliki denting resonansi yang kuat.', tag: 'Punchline Ending', promptText: `Berikut adalah draf paragraf penutup saya:\n"[PASTE DRAF PENUTUP ANDA]".\n\nTolong evaluasi dan berikan 3 alternatif kalimat terakhir (punchline ending) yang paling menggetarkan hati pembaca.` },
      { id: 'kt-05', categoryId: 'kalimat-penutup', title: 'Ending Pelepasan & Keikhlasan', description: 'Ciptakan penutup untuk cerita tentang kehilangan atau merelakan seseorang.', tag: 'Keikhlasan', promptText: `Naskah saya adalah tentang proses merelakan seseorang/sesuatu yang sangat berharga.\nBantu saya menyusun 4 opsi kalimat penutup yang lembut, jujur, dan menyentuh ranah terdalam tentang arti melepaskan tanpa dendam.` },

      // 6. Perbaiki Diksi
      { id: 'pd-01', categoryId: 'perbaiki-diksi', title: 'Meningkatkan Kualitas Diksi Biasa Menjadi Sastra', description: 'Ganti kata-kata pasaran dengan sinonim sastra yang kaya dan bernyawa.', tag: 'Enhance Diksi', promptText: `Bertindaklah sebagai editor gaya bahasa sastra.\nBerikut adalah cuplikan paragraf dari naskah saya:\n"[PASTE PARAGRAF YANG INGIN DIPERBAIKI]".\n\nTolong perbaiki paragraf ini dengan mengganti kata-kata yang terlalu umum menjadi diksi sastra Indonesia yang anggun dan berbobot tanpa membuatnya terasa berlebihan atau sulit dipahami.\nTunjukkan tabel perbandingan kata sebelum dan sesudah.` },
      { id: 'pd-02', categoryId: 'perbaiki-diksi', title: 'Menghapus Klise & Frasa Pasaran', description: 'Temukan ungkapan klise yang sering diulang dan gantikan dengan metafora segar.', tag: 'Hapus Klise', promptText: `Periksa teks berikut ini:\n"[PASTE TEKS ANDA]".\n\nTolong identifikasi seluruh ungkapan klise (misal: "bagai disambar petir", "air mata bercucuran"), dan ganti setiap klise tersebut dengan 2 alternatif metafora baru yang orisinal dan segar.` },
      { id: 'pd-03', categoryId: 'perbaiki-diksi', title: 'Membangun Ritme Kalimat & Aliterasi Indah', description: 'Rapikan panjang-pendek kalimat agar enak dibaca dengan suara lantang.', tag: 'Ritme & Musikalitas', promptText: `Berikut adalah naskah saya:\n"[PASTE PARAGRAF ANDA]".\n\nTolong tata ulang struktur kalimatnya agar memiliki irama baca yang musikal sehingga sangat nyaman saat dibacakan secara vokal.` },
      { id: 'pd-04', categoryId: 'perbaiki-diksi', title: 'Eksplorasi Kata Kerja Sensorik Aktif', description: 'Ganti kata kerja pasif menjadi kata kerja aktif yang memicu imajinasi visual.', tag: 'Kata Kerja Sensorik', promptText: `Tolong ubah kalimat-kalimat deskriptif berikut agar menggunakan kata kerja sensorik yang lebih tajam dan hidup:\n"[PASTE BEBERAPA KALIMAT DESKRIPSI ANDA]".\n\nFokus pada penguatan visualisasi, bunyi, dan sensasi sentuhan fisik tokoh.` },
      { id: 'pd-05', categoryId: 'perbaiki-diksi', title: 'Harmonisasi Nada Bahasa (Tone Consistency)', description: 'Pastikan nada bahasa dari awal hingga akhir konsisten tidak melompat.', tag: 'Konsistensi Nada', promptText: `Berikut adalah potongan bagian awal dan bagian tengah naskah saya:\n"[PASTE POTONGAN TEKS]".\n\nTolong cek apakah nada bahasanya sudah serasi dan tidak saling bertabrakan. Berikan rekomendasi perbaikan kalimat yang melenceng.` },

      // 7. Proofreading
      { id: 'pr-01', categoryId: 'proofreading', title: 'Pemeriksaan PUEBI, Typo & Ejaan Baku', description: 'Deteksi kesalahan ketik, kata tidak baku, dan ejaan sesuai KBBI/PUEBI.', tag: 'PUEBI & KBBI', promptText: `Bertindaklah sebagai korektor naskah (proofreader) profesional berstandar penerbit mayor.\nTolong periksa teks berikut:\n"[PASTE NASKAH ANDA DI SINI]".\n\nLakukan pemeriksaan mendalam terhadap:\n1. Typo / salah ketik.\n2. Kata tidak baku (ubah ke bentuk baku KBBI: misal 'sekedar' -> 'sekadar', 'merubah' -> 'mengubah').\n3. Penulisan imbuhan 'di-' (sebagai awalan vs kata depan penunjuk tempat).\n\nSajikan hasil koreksi dalam format daftar yang rapi dan sertakan teks utuh yang sudah bersih.` },
      { id: 'pr-02', categoryId: 'proofreading', title: 'Koreksi Format Tanda Baca Dialog', description: 'Rapikan tanda petik dua, koma, titik, dan huruf kapital pada percakapan.', tag: 'Tanda Baca Dialog', promptText: `Berikut adalah naskah saya yang memuat percakapan antar tokoh:\n"[PASTE TEKS DIALOG ANDA]".\n\nTolong rapikan seluruh tanda baca dialog sesuai aturan penulisan sastra resmi Indonesia (letak tanda petik, tanda koma/titik di dalam dialog, dan penulisan dialog tag).` },
      { id: 'pr-03', categoryId: 'proofreading', title: 'Deteksi Kalimat Bertele-tele (Wordiness)', description: 'Pangkas kata-kata mubazir agar naskah lebih padat dan bertenaga.', tag: 'Pangkas Mubazir', promptText: `Tolong pangkas kata-kata mubazir dan kalimat yang bertele-tele dari teks berikut:\n"[PASTE TEKS ANDA]".\n\nTujuan: Membuat naskah lebih efisien, hemat kata, namun maknanya tetap utuh dan lebih kuat.` },
      { id: 'pr-04', categoryId: 'proofreading', title: 'Pemeriksaan Konsistensi Sudut Pandang (POV)', description: "Pastikan kata ganti orang ('aku', 'ia', 'kami') tidak tertukar di tengah jalan.", tag: 'Cek Konsistensi POV', promptText: `Tolong periksa apakah ada pergeseran sudut pandang narator yang tidak sengaja (POV slip) pada teks berikut:\n"[PASTE TEKS LENGKAP ANDA]".` },
      { id: 'pr-05', categoryId: 'proofreading', title: 'Audit Akhir Kesiapan Setor Naskah', description: 'Pemeriksaan kelayakan menyeluruh sebelum naskah dikirim ke kurator antologi.', tag: 'Final Audit', promptText: `Saya akan menyetorkan naskah ini ke kurasi buku antologi.\nBerikut naskah lengkap saya:\n"[PASTE NASKAH LENGKAP]".\n\nBerikan audit ringkas mengenai kerapian ejaan, kejelasan alur, dan kekuatan naskah.` },

      // 8. Perbaiki Emosi
      { id: 'pe-01', categoryId: 'perbaiki-emosi', title: "Show, Don't Tell: Mengubah Pernyataan Menjadi Gestur", description: 'Ubah kalimat yang hanya "memberitahu" menjadi adegan nyata yang terasa di tubuh.', tag: "Show, Don't Tell", promptText: `Tolong bantu saya menerapkan teknik Show, Don't Tell pada potongan naskah berikut:\n"[PASTE POTONGAN NASKAH]".\n\nUbah pernyataan emosi abstrak (misal: "Dia sangat sedih dan kecewa") menjadi detail reaksi fisik konkret (gerak napas, tatapan mata, gemetar tangan, ketegangan otot leher, atau keheningan yang canggung).\nBerikan 3 variasi penggambaran.` },
      { id: 'pe-02', categoryId: 'perbaiki-emosi', title: 'Memperdalam Monolog Batin & Kejujuran Tokoh', description: 'Buka lapisan pikiran terdalam yang paling rentan dan manusiawi dari tokoh.', tag: 'Kejujuran Batin', promptText: `Pada adegan berikut, tokoh saya sedang mengalami dilema batin:\n"[JELASKAN DILEMA ATAU PASTE PARAGRAF]".\n\nTolong perdalam monolog batin tokoh agar terasa lebih rentan, jujur, dan tidak berpura-pura kuat. Biarkan pembaca merasakan detak kebingungan yang nyata di dalam benaknya.` },
      { id: 'pe-03', categoryId: 'perbaiki-emosi', title: 'Membangun Ketegangan Batin Antara Dua Tokoh', description: 'Ciptakan adegan di mana hal yang tidak terucap jauh lebih berat daripada dialog.', tag: 'Subtext & Hening', promptText: `Saya ingin menulis adegan pertemuan dua tokoh yang menyimpan luka lama di antara mereka.\nTolong bantu saya menyusun interaksi yang kaya akan subtext (hal-hal yang sengaja disembunyikan di balik tatapan dan jeda panjang percakapan).\nBerikan draf adegan 200–300 kata.` },
      { id: 'pe-04', categoryId: 'perbaiki-emosi', title: 'Menghadirkan Duka Tanpa Melodramatis', description: 'Sentuh hati pembaca secara elegan tanpa terkesan berlebihan atau meratap.', tag: 'Duka Elegan', promptText: `Adegan naskah saya menceritakan tentang momen kehilangan orang/tempat tercinta:\n"[JELASKAN PERISTIWA KEHILANGAN]".\n\nTolong tuliskan ulang adegan ini dengan pendekatan yang tenang, hening, dan terhormat. Hindari drama berlebihan; fokuskan pada kehampaan di sudut ruangan dan rutinitas kecil yang kini terasa berbeda.` },
      { id: 'pe-05', categoryId: 'perbaiki-emosi', title: 'Memperkuat Momen Katarsis & Rekonsiliasi Batin', description: 'Hadirkan pelepasan emosi yang membuat pembaca menarik napas lega.', tag: 'Katarsis', promptText: `Saya ingin momen rekonsiliasi/klimaks batin dalam cerita saya berikut ini terasa menggetarkan:\n"[PASTE DRAF ADEGAN REKONSILIASI]".\n\nBantu saya memoles kata-katanya agar momen saat tokoh akhirnya memaafkan/merelakan terasa seperti beban berat yang perlahan terangkat dari dada.` },

      // 9. Caption Promosi
      { id: 'cp-01', categoryId: 'caption-promosi', title: 'Caption Storytelling Teaser Peluncuran Buku Antologi', description: 'Ajak pembaca penasaran dengan cerita di balik proses penulisan naskahmu.', tag: 'Storytelling Teaser', promptText: `Bertindaklah sebagai copywriter sastra untuk media sosial (Instagram/Threads/TikTok).\nNaskah saya dalam buku antologi berjudul: "[JUDUL NASKAH]".\nInti cerita naskah: "[JELASKAN INTI KISAH]".\nBuku antologi ini diterbitkan oleh: "Ranah Menulis".\n\nTolong buatkan 2 opsi caption storytelling yang menyentuh hati:\n- Hook pembuka yang relatable -> Kisah singkat di balik penulisan -> Call to Action lembut.\n- Gunakan nada bahasa yang hangat, bersahaja, dan estetis.` },
      { id: 'cp-02', categoryId: 'caption-promosi', title: 'Caption Kutipan Terbaik (Quote Reveal Post)', description: 'Format caption estetik yang mengiringi gambar kutipan naskahmu.', tag: 'Quote Post', promptText: `Berikut adalah kutipan terbaik dari bab naskah saya di buku antologi:\n"[MASUKKAN KUTIPAN KUNCI]".\n\nBantu saya membuat caption Instagram yang menguraikan makna di balik kutipan tersebut dalam 3–4 paragraf pendek yang reflektif, diakhiri dengan ajakan membaca cerita lengkapnya di buku antologi terbaru Ranah Menulis.` },
      { id: 'cp-03', categoryId: 'caption-promosi', title: 'Caption Pembukaan Pre-Order (Pre-Order Launch)', description: 'Promosikan masa pemesanan buku antologi dengan ajakan yang elegan.', tag: 'Pre-Order Promo', promptText: `Buku antologi bersama Ranah Menulis yang memuat tulisan saya akhirnya resmi membuka sesi Pre-Order!\nJudul Naskah Saya: "[JUDUL NASKAH]"\nJudul Buku Antologi: "[JUDUL BUKU]"\nBenefit / Periode PO: "[MASUKKAN DETAIL PO / TANGGAL]"\n\nTolong buatkan caption promosi yang elegan, tidak terkesan hard-selling, namun membuat teman dan pembaca merasa ingin memiliki buku ini di rak mereka.` },
      { id: 'cp-04', categoryId: 'caption-promosi', title: 'Carousel Copywriting: 5 Pelajaran dari Naskah Saya', description: 'Susun teks slide demi slide untuk postingan edukatif/reflektif Instagram carousel.', tag: 'Carousel Slides', promptText: `Saya ingin membuat postingan Instagram Carousel (5–7 slide) berdasarkan tema naskah saya: "[MASUKKAN TEMA CERITA]".\n\nTolong buatkan susunan teks per slide:\n- Slide 1: Cover Hook yang memikat.\n- Slide 2–5: 4 Pelajaran hidup atau renungan batin utama dari cerita.\n- Slide 6: Cuplikan satu paragraf dari buku.\n- Slide 7: Penutup & ajakan memiliki buku antologi.` },

                                <Icon name="Lock" size={18} className="text-zinc-900" />
                                <h3 className="text-base font-bold text-zinc-900">Password Workspace</h3>
                              </div>
                              <button onClick={() => setProfileActiveModal(null)} className="p-1 rounded-lg text-zinc-400 hover:text-black">
                                <Icon name="X" size={18} />
                              </button>
                            </div>
                            <p className="text-xs sm:text-sm text-zinc-600 leading-relaxed font-medium">
                              Sesi workspace Anda terlindungi dengan Password Workspace resmi program antologi Ranah Menulis. Kredensial tersimpan secara aman pada penyimpanan sesi lokal perangkat.
                            </p>
                            <div className="p-3.5 rounded-xl bg-zinc-50 border border-zinc-200 text-xs font-semibold text-zinc-800 flex items-center gap-2">
                              <Icon name="ShieldCheck" size={16} className="text-emerald-600" />
                              <span>Status: Terotentikasi & Aktif</span>
                            </div>
                          </React.Fragment>
                        )}

                        {profileActiveModal === 'about' && (
                          <React.Fragment>
                            <div className="flex items-center justify-between pb-2 border-b border-zinc-100">
                              <div className="flex items-center gap-2">
                                <Icon name="Info" size={18} className="text-zinc-900" />
                                <h3 className="text-base font-bold text-zinc-900">Tentang Penulis+</h3>
                              </div>
                              <button onClick={() => setProfileActiveModal(null)} className="p-1 rounded-lg text-zinc-400 hover:text-black">
                                <Icon name="X" size={18} />
                              </button>
                            </div>
                            <div className="space-y-2 text-xs sm:text-sm text-zinc-600 leading-relaxed font-medium">
                              <p>
                                <strong>Penulis+ Workspace</strong> adalah ruang kerja digital eksklusif yang dirancang khusus untuk memfasilitasi para peserta penulisan buku antologi bersama <em>Ranah Menulis</em>.
                              </p>
                              <p>
                                Menggabungkan perpustakaan inspirasi terkurasi, ruang tulis bebas distraksi, blueprint naskah 10 hari, dan panduan prompt AI sastra.
                              </p>
                            </div>
                            <div className="text-[11px] text-zinc-400 font-semibold pt-1">
                              © 2026 Ranah Menulis • Hak Cipta Dilindungi
                            </div>
                          </React.Fragment>
                        )}

                        {profileActiveModal === 'privacy' && (
                          <React.Fragment>
                            <div className="flex items-center justify-between pb-2 border-b border-zinc-100">
                              <div className="flex items-center gap-2">
                                <Icon name="ShieldCheck" size={18} className="text-zinc-900" />
                                <h3 className="text-base font-bold text-zinc-900">Kebijakan Privasi</h3>
                              </div>
                              <button onClick={() => setProfileActiveModal(null)} className="p-1 rounded-lg text-zinc-400 hover:text-black">
                                <Icon name="X" size={18} />
                              </button>
                            </div>
                            <div className="space-y-2 text-xs sm:text-sm text-zinc-600 leading-relaxed font-medium">
                              <p>
                                Semua draf naskah, refleksi workbook harian, dan preferensi tersimpan Anda disimpan 100% secara lokal pada penyimpanan perangkat Anda (Browser Local Storage).
                              </p>
                              <p>
                                Penulis+ tidak mengirimkan isi naskah Anda ke server pihak ketiga tanpa persetujuan Anda. Hak cipta naskah sepenuhnya milik penulis.
                              </p>
                            </div>
                          </React.Fragment>
                        )}

                        <div className="pt-2 flex justify-end">
                          <Button variant="primary" size="sm" onClick={() => setProfileActiveModal(null)}>
                            Tutup
                          </Button>
                        </div>
                      </Card>
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* Mobile Bottom Navigation */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-zinc-200/80 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
              <div className="max-w-md mx-auto px-2 h-16 flex items-center justify-around">
                {navTabs.map((item) => {
                  const isActive = currentView === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        setCurrentView(item.id);
                        if (item.id === 'menulis') setWorkspaceSubView(null);
                        if (item.id === 'inspirasi') { setSelectedInspirasiCategoryId(null); setInspirasiSearch(''); }
                        if (item.id === 'ai') { setSelectedAiCategoryId(null); setAiSearchQuery(''); setShowOnlyAiFavorites(false); }
                      }}
                      className={`flex flex-col items-center justify-center flex-1 py-1.5 px-1 rounded-xl transition-all duration-200 relative group focus:outline-none ${
                        isActive ? 'text-black font-semibold' : 'text-zinc-400 hover:text-zinc-700 font-medium'
                      }`}
                    >
                      <div className={`p-1 rounded-xl transition-all duration-200 ${isActive ? 'bg-zinc-100 scale-105' : ''}`}>
                        <Icon name={item.icon} size={20} strokeWidth={isActive ? 2.3 : 1.8} />
                      </div>
                      <span className="text-[10px] tracking-tight mt-0.5 select-none leading-none">{item.label}</span>
                      {isActive && <span className="w-1 h-1 rounded-full bg-black mt-1" />}
                    </button>
                  );
                })}
              </div>
            </nav>
          </div>
        </div>
      );
    }

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<MainApp />);
    } catch (err) {
      console.error('Render Error:', err);
      document.getElementById('root').innerHTML = `
        <div style="padding: 24px; font-family: sans-serif; color: #111;">
          <h2 style="font-size: 18px; font-weight: bold;">Terjadi kesalahan saat memuat aplikasi</h2>
          <pre style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 8px;">${err.message}</pre>
        </div>
      `;
    }
  </script>
</body>
</html>
